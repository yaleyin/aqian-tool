name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认使用的是最新 Release，并且问题可以复现。
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: "例如 1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: "例如 Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开... 2. 点击... 3. 看到..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 截图或其他信息
