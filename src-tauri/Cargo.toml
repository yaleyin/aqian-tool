[package]
name = "aqian-tauri"
version = "1.0.0"
description = "A local offline tool for splitting group trip expenses"
authors = ["ylyin"]
edition = "2024"

[lib]
name = "aqian_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
trash = "5"
tempfile = "3"
open = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
